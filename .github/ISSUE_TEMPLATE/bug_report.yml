name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not upload private designs, credentials, session tokens, or customer screenshots. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installation method
      options:
        - GitHub Release package
        - Source checkout
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or sanitized inputs only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, session tokens, private designs, and customer data.
          required: true
