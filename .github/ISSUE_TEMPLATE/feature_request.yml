name: Feature request
description: Propose a scoped product improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and offline impact
      description: Does this add an external service or new data transfer?
    validations:
      required: true
