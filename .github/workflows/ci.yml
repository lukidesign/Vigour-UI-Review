name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.22.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          enable-cache: true
          cache-dependency-glob: apps/vision-engine/uv.lock
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project apps/vision-engine --extra dev --extra ocr --frozen
      - name: Run release checks
        run: pnpm release:check
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
  windows-payload:
    name: Windows x64 development package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.22.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          enable-cache: true
          cache-dependency-glob: apps/vision-engine/uv.lock
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate locked Windows Python dependencies
        run: uv sync --project apps/vision-engine --extra dev --extra ocr --frozen
      - name: Typecheck
        run: pnpm typecheck
      - name: Exercise Windows installer ownership and rollback rules
        run: pnpm exec vitest run scripts/windows-installer.test.js apps/local-service/src/keychain.test.ts
      - name: Build sealed offline payload
        run: pnpm package:windows
      - name: Verify payload and licenses
        run: pnpm package:windows:check
      - name: Smoke test bundled Python and offline core analysis
        run: pnpm package:windows:smoke
      - name: Smoke test Windows credentials and Native binary protocol
        run: pnpm package:windows:native-smoke
      - name: Compile GUI installer
        run: pnpm package:windows:installer
