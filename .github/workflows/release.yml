name: Release macOS arm64

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish offline package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.22.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          enable-cache: true
          cache-dependency-glob: apps/vision-engine/uv.lock
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project apps/vision-engine --extra dev --extra ocr --frozen
      - name: Verify release tag
        run: pnpm release:verify-tag "${GITHUB_REF_NAME}"
      - name: Run release checks
        run: pnpm release:check
      - name: Build offline package
        run: pnpm package:dev
      - name: Inspect packaged application
        run: pnpm package:check
      - name: Smoke-test packaged application
        run: pnpm package:smoke
      - name: Create archive and checksum
        run: pnpm package:archive
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/Vigour-UI-Review-v*-macos-arm64.zip
            release-artifacts/Vigour-UI-Review-v*-macos-arm64.zip.sha256
