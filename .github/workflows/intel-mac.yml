name: Intel Mac core preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-core:
    name: Intel x64 core-only installer
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONDONTWRITEBYTECODE: '1'
      VIGOUR_UI_REVIEW_PACKAGE_DIR: ${{ github.workspace }}/release/intel-payload
      VIGOUR_INSTALLER_OUTPUT: ${{ github.workspace }}/release/intel-stage/Vigour UI Review Setup.app
      VIGOUR_INSTALLER_PAYLOAD: ${{ github.workspace }}/release/intel-stage/Vigour UI Review Setup.app/Contents/Resources/companion
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - run: npm install --global pnpm@11.22.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          enable-cache: true
          cache-dependency-glob: apps/vision-engine/uv.lock
      - name: Require a native Intel build host
        run: node -e "if(process.platform!=='darwin'||process.arch!=='x64') process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - name: Install locked core dependencies (no OCR)
        run: uv sync --project apps/vision-engine --python 3.12 --extra dev --frozen
      - name: Source tests and synthetic baseline
        run: pnpm release:check
      - name: Build native x64 offline payload
        run: pnpm package:dev
      - name: Integrity and private-path checks
        run: pnpm package:check
      - name: Core analysis and unavailable OCR capability
        run: pnpm package:smoke
      - name: Compile GUI installer
        run: pnpm build:installer
      - name: Verify every bundled Mach-O architecture and deployment target
        run: node scripts/check-macos-architecture.mjs
      - name: Isolated install, Native startup, update, rollback, repair and uninstall
        run: pnpm test:installer
      - name: Archive candidate with matching extension and provenance
        env:
          VIGOUR_SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/stage-intel-candidate.mjs
      - name: Upload checked Intel candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vigour-UI-Review-v0.0.2-beta.3-macos-x64-core-unsigned
          path: release-artifacts/intel-candidate/*
          if-no-files-found: error
          retention-days: 7
